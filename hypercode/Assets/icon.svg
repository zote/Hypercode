<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Grid de ícone do macOS: squircle de 824px centralizado no canvas de 1024px.
       O desenho é feito em unidades de 104 e escalado para o squircle. -->
  <g transform="translate(100 100) scale(7.923)">
    <rect width="104" height="104" rx="23.4" fill="#161a22"/>

    <!-- janela do terminal -->
    <rect x="14" y="20" width="76" height="64" rx="8" fill="#232936"/>
    <path d="M14 28 a8 8 0 0 1 8 -8 h60 a8 8 0 0 1 8 8 v5 h-76 z" fill="#2e3544"/>
    <circle cx="23" cy="26.5" r="2.6" fill="#ff5f57"/>
    <circle cx="31" cy="26.5" r="2.6" fill="#febc2e"/>
    <circle cx="39" cy="26.5" r="2.6" fill="#28c840"/>

    <!-- prompt -->
    <path d="M23 49 L31 56 L23 63" fill="none" stroke="#3ddc97" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- grafo de branches: tronco e um ramo saindo dele -->
    <path d="M51 65 C51 56 72 58 72 50 V43" fill="none" stroke="#38bdf8" stroke-width="4"
          stroke-linecap="round"/>
    <path d="M51 74 V43" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/>
    <circle cx="51" cy="43" r="4.6" fill="#3ddc97"/>
    <circle cx="72" cy="43" r="4.6" fill="#38bdf8"/>
    <circle cx="51" cy="74" r="4.6" fill="#3ddc97"/>
  </g>
</svg>
